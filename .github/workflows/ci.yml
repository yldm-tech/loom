name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The catalog is a contract: every declared component must exist in the
      # registry, and every block recipe must match its props. tsc enforces both.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          JEV_TOKEN: build-time-placeholder
          LLM_TOKEN: build-time-placeholder
